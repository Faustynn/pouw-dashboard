version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Un-comment when web/package.json is added
  # - package-ecosystem: npm
  #   directory: /web
  #   schedule:
  #     interval: weekly
  #   groups:
  #     dependencies:
  #       patterns: ["*"]

  # Base images: node and nginx in web/, graphql-engine in hasura/
  - package-ecosystem: docker
    directories: [/web, /hasura]
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
