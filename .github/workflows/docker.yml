name: Docker image

# Publishes images to GitHub Container Registry:
#   web/     -> ghcr.io/pouw-zk/pouw-dashboard         (explorer UI)
#   hasura/  -> ghcr.io/pouw-zk/pouw-dashboard-hasura  (Hasura with the metadata)
# main   -> tags :main and :sha-xxxxxxx
# v1.2.3 -> tags :v1.2.3 and :latest
# An image whose directory is not ready yet (see `requires`) is skipped with a message.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: web
            image: pouw-dashboard
            requires: web/package.json
          - dir: hasura
            image: pouw-dashboard-hasura
            requires: hasura/metadata/version.yaml
    steps:
      - uses: actions/checkout@v7

      - name: Detect project
        id: detect
        run: |
          if [ -f "${{ matrix.requires }}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.requires }} does not exist yet, nothing to publish."
          fi

      - name: Build and push
        if: steps.detect.outputs.found == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIR: ${{ matrix.dir }}
          IMAGE: ghcr.io/pouw-zk/${{ matrix.image }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=(-t "$IMAGE:sha-${GITHUB_SHA::7}")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags+=(-t "$IMAGE:main"); fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags+=(-t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest"); fi
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            "${tags[@]}" "$DIR"
          docker push --all-tags "$IMAGE"
