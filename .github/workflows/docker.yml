name: Docker image

# Publishes images to GitHub Container Registry for linux/amd64 (the server,
# x86 laptops) and linux/arm64 (Apple Silicon):
#   web/     -> ghcr.io/pouw-zk/pouw-dashboard         (explorer UI)
#   hasura/  -> ghcr.io/pouw-zk/pouw-dashboard-hasura  (Hasura with the metadata)
# main         -> tags :main and :sha-xxxxxxx
# other branch -> tags :branch-<name> and :sha-xxxxxxx (feature/X -> :branch-feature-x),
#                 for the dev network and `make images REFS=...` in pouw-deploy
# v1.2.3       -> tags :v1.2.3, :latest and :sha-xxxxxxx
# Every image has GIT_COMMIT, GIT_BRANCH and BUILD_TIME (build args), the
# service shows them at GET /manage/info.
# Only in the PoUW-ZK organization: a fork cannot push to its GHCR.
# Each platform builds natively on its own runner (no emulation) and pushes by
# digest; the merge job joins the digests into one multi-platform tag.
# An image whose directory is not ready yet (see `requires`) is skipped with a message.

on:
  push:
    # Dependabot cannot push packages, its branches only run ci.yml
    branches: ["**", "!dependabot/**"]
    tags: ["v*"]
  workflow_dispatch:

# A newer push to the same branch cancels the older run, so :branch-<name> is
# never set back to an older commit. main and tags get a group of their own per
# run: every commit of main keeps its :sha- image (staging deploys those).
concurrency:
  group: docker-${{ (startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build ${{ matrix.target.image }} (${{ matrix.arch.platform }})
    if: github.repository_owner == 'PoUW-ZK'
    strategy:
      fail-fast: false
      matrix:
        target:
          - { dir: web, image: pouw-dashboard, requires: web/package.json }
          - { dir: hasura, image: pouw-dashboard-hasura, requires: hasura/metadata/version.yaml }
        arch:
          - { platform: linux/amd64, runner: ubuntu-latest, name: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, name: arm64 }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect project
        id: detect
        env:
          REQUIRES: ${{ matrix.target.requires }}
          DIR: ${{ matrix.target.dir }}
        run: |
          if [ -f "$DIR/Dockerfile" ] && [ -f "$REQUIRES" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$DIR/Dockerfile or $REQUIRES does not exist yet, nothing to publish."
          fi

      - name: Build and push by digest
        if: steps.detect.outputs.found == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIR: ${{ matrix.target.dir }}
          IMAGE: ghcr.io/pouw-zk/${{ matrix.target.image }}
          PLATFORM: ${{ matrix.arch.platform }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # the docker-container builder can push an image by digest only
          docker buildx create --use >/dev/null
          docker buildx build --platform "$PLATFORM" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --build-arg "GIT_COMMIT=$GITHUB_SHA" \
            --build-arg "GIT_BRANCH=$GITHUB_REF_NAME" \
            --build-arg "BUILD_TIME=$(date -u +%FT%TZ)" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json "$DIR"
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          mkdir -p digests
          touch "digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        if: steps.detect.outputs.found == 'true'
        with:
          # -- separates the image from the platform, so the pattern of one image
          # never matches another (pouw-dashboard-* would match pouw-dashboard-hasura)
          name: digests--${{ matrix.target.image }}--${{ matrix.arch.name }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge ${{ matrix.target.image }}
    needs: build
    strategy:
      # one image failing must not cancel the tagging of the other
      fail-fast: false
      matrix:
        target:
          - { dir: web, image: pouw-dashboard, requires: web/package.json }
          - { dir: hasura, image: pouw-dashboard-hasura, requires: hasura/metadata/version.yaml }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests--${{ matrix.target.image }}--*
          merge-multiple: true
          path: digests

      - name: Tag the multi-platform image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/pouw-zk/${{ matrix.target.image }}
        run: |
          shopt -s nullglob
          digests=(digests/*)
          if [ ${#digests[@]} -eq 0 ]; then
            echo "::notice::No image was built, nothing to tag."
            exit 0
          fi
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=(-t "$IMAGE:sha-${GITHUB_SHA::7}")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags+=(-t "$IMAGE:main"); fi
          if [[ "$GITHUB_REF" == refs/heads/* && "$GITHUB_REF" != refs/heads/main ]]; then
            # a tag allows [a-z0-9._-] (lower case here), at most 128 characters
            branch="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')"
            tags+=(-t "$IMAGE:branch-${branch:0:120}")
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags+=(-t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest"); fi
          refs=()
          for d in "${digests[@]}"; do refs+=("$IMAGE@sha256:${d#digests/}"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"
