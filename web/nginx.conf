server {
    listen 8080;
    root /usr/share/nginx/html;

    # Client-side routing: unknown paths return index.html and the router shows the page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash into asset names, so they can be cached for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
